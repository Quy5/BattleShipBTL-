<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MISSION ACCOMPLISHED | BATTLESHIP</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/victory.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="crt-overlay"></div>

    <main class="victory-container">
        <header class="victory-header">
            <p class="status-subtitle">MISSION ACCOMPLISHED</p>
            <h1 id="victory-title">VICTORY</h1>
        </header>

        <section class="rank-promotion">
            <div class="rank-badge">
                <div class="badge-icon" id="rank-icon">🏅</div>
                <div class="rank-info">
                    <span class="label" id="rank-label">RANK PROMOTED</span>
                    <h2 id="rank-name">FLEET ADMIRAL</h2>
                </div>
                <!-- Vị trí hiển thị thời gian hoàn thành game đấu bên cạnh Rank -->
                <div class="time-info"
                    style="margin-left: 20px; padding-left: 20px; border-left: 1px solid var(--glass-border);">
                    <span class="label"
                        style="font-size: 0.6rem; color: var(--text-muted); letter-spacing: 2px;">COMPLETION TIME</span>
                    <h2 id="rank-time" style="font-size: 1.5rem; color: var(--primary-blue);">00:00</h2>
                </div>
            </div>
        </section>

        <section class="final-stats">
            <div class="stat-card">
                <div class="icon">❂</div>
                <div class="value" id="stat-shots">0</div>
                <div class="label">SHOTS FIRED</div>
            </div>
            <div class="stat-card">
                <div class="icon">🎯</div>
                <div class="value" id="stat-accuracy">0%</div>
                <div class="label">ACCURACY</div>
            </div>
            <div class="stat-card">
                <div class="icon">⚓</div>
                <div class="value" id="stat-sunk">5/5</div>
                <div class="label">SHIPS SUNK</div>
            </div>
            <div class="stat-card">
                <div class="icon">⏱</div>
                <div class="value" id="stat-duration">00:00</div>
                <div class="label">DURATION</div>
            </div>
        </section>

        <nav class="victory-nav">
            <button onclick="location.href='deployment.html'" class="tactical-btn primary">
                <span class="icon">🔄</span> PLAY AGAIN
            </button>
            <button onclick="location.href='home.html'" class="tactical-btn">
                <span class="icon">☰</span> RETURN TO MENU
            </button>
        </nav>
    </main>

    <div class="corner-accents">
        <div class="top-left"></div>
        <div class="top-right"></div>
        <div class="bottom-left"></div>
        <div class="bottom-right"></div>
    </div>

    <script src="../js/core/Storage.js"></script>
    <script src="../js/core/GameModels.js"></script>
    <script src="../js/core/AudioManager.js"></script>
    <script src="../js/controllers/VictoryController.js"></script>
</body>

</html>
