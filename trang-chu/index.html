<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BATTLESHIP | TACTICAL NAVAL WARFARE</title>
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="crt-overlay"></div>

    <main class="menu-container">
        <div class="background-wrapper">
            <img src="../assets/menu_bg.png" alt="Naval Hintergrund" class="bg-image">
            <div class="bg-overlay"></div>
        </div>

        <section class="content">
            <header class="title-section">
                <h1 class="glitch" data-text="BATTLESHIP">BATTLESHIP</h1>
                <p class="subtitle">TACTICAL NAVAL WARFARE</p>
                <div class="target-rings">
                    <div class="ring"></div>
                    <div class="ring"></div>
                    <div class="crosshair"></div>
                </div>
            </header>

            <nav class="menu-nav">
                <button onclick="location.href='../trang-dat-thuyen/index.html'" class="tactical-btn primary">
                    <span class="btn-text">PLAY GAME</span>
                    <span class="btn-icon">▶</span>
                </button>
                <button onclick="location.href='instructions.html'" class="tactical-btn">
                    <span class="btn-text">HOW TO PLAY</span>
                    <span class="btn-icon">📋</span>
                </button>
                <button onclick="window.close()" class="tactical-btn">
                    <span class="btn-text">EXIT</span>
                    <span class="btn-icon">⏻</span>
                </button>
            </nav>
        </section>

        <footer class="bottom-bar">
            <div class="status-items">
                <div class="status-item"><span class="icon">♞</span><span class="label">TACTICAL</span></div>
                <div class="status-item"><span class="icon">🏅</span><span class="label">RANK</span></div>
                <div class="status-item" id="sound-toggle" style="cursor: pointer;"><span class="icon"
                        id="sound-icon">🔊</span><span class="label" id="sound-label">SOUND ON</span></div>
            </div>
            <div class="settings"><button class="settings-btn">⚙ SETTINGS</button></div>
        </footer>
    </main>

    <script src="../logic/shared.js"></script>
    <script src="script.js"></script>
</body>

</html>
